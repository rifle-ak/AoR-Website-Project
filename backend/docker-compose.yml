version: '3.8'

services:
  api:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      RUST_SERVER_IP: ${RUST_SERVER_IP}
      RUST_SERVER_PORT: ${RUST_SERVER_PORT}
      ENABLE_RUST_PLUS: ${ENABLE_RUST_PLUS:-false}
      DATABASE_PATH: /data/aor.db
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
