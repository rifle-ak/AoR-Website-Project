name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # The oldest version the site supports, and a current one.
        php-version: ['7.4', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: artofrust_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_mysql, mbstring, json

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Import database schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot artofrust_db < api/schema.sql

      - name: Write test configuration
        run: |
          cat > api/config.local.php <<'PHP'
          <?php
          define('DB_HOST', '127.0.0.1');
          define('DB_USER', 'root');
          define('DB_PASS', 'root');
          define('SITE_URL', 'http://127.0.0.1:8080');
          PHP

      - name: Start the site
        run: |
          php -S 127.0.0.1:8080 -t . tools/router.php &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/api/health > /dev/null && break
            sleep 1
          done

      - name: Smoke-test pages and API
        run: bash tools/smoke-test.sh http://127.0.0.1:8080
